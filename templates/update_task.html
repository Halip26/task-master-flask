{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Update Task</h2>
    <form method="POST" action="{{ url_for('update_task', id=task.id) }}">
        {{ form.csrf_token }}
        <div class="form-group">
            <label for="content">Task Content</label>
            <input type="text" class="form-control" id="content" name="content" value="{{ task.content }}" required>
        </div>
        
        <div class="form-group">
            <label for="due_date">Due Date</label>
            <input type="date" class="form-control" id="due_date" name="due_date" 
                   value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
        </div>

        <div class="form-group">
            <label for="category_id">Category</label>
            <select class="form-control" id="category_id" name="category_id">
                <option value="">No Category</option>
                {% for category in categories %}
                <option value="{{ category.id }}" 
                        {% if task.category_id == category.id %}selected{% endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="priority_id">Priority</label>
            <select class="form-control" id="priority_id" name="priority_id">
                <option value="">No Priority</option>
                {% for priority in priorities %}
                <option value="{{ priority.id }}"
                        {% if task.priority_id == priority.id %}selected{% endif %}>
                    {{ priority.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update Task</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
