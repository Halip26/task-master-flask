<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-8">
    <div class="container mx-auto px-4 max-w-md w-full">
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-8">Update Task</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-3">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-lg shadow-md
                            {% if category == 'success' %} bg-green-100 text-green-800 border border-green-200
                            {% elif category == 'error' %} bg-red-100 text-red-800 border border-red-200
                            {% else %} bg-blue-100 text-blue-800 border border-blue-200
                            {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="bg-white p-6 rounded-xl shadow-lg">
            <form action="/update/{{ task.id }}" method="POST" class="space-y-6">
                <div>
                    <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Task Content:</label>
                    <input type="text" name="content" id="content" value="{{ task.content }}"
                           class="block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800"
                           required>
                </div>
                <div>
                    <label for="due_date" class="block text-sm font-medium text-gray-700 mb-2">Due Date:</label>
                    <input type="date" name="due_date" id="due_date" value="{{ current_due_date }}"
                           class="block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
                </div>
                <div>
                    <label for="category_id" class="block text-sm font-medium text-gray-700 mb-2">Category:</label>
                    <select name="category_id" id="category_id"
                            class="block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
                        <option value="0">-- No Category --</option> {# Using value 0 to explicitly remove category #}
                        {% for category in categories %}
                            <option value="{{ category.id }}"
                                {% if task.category and task.category.id == category.id %} selected {% endif %}>
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="priority_id" class="block text-sm font-medium text-gray-700 mb-2">Priority:</label>
                    <select name="priority_id" id="priority_id"
                            class="block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
                        <option value="0">-- No Priority --</option> {# Using value 0 to explicitly remove priority #}
                        {% for priority in priorities %}
                            <option value="{{ priority.id }}"
                                {% if task.priority and task.priority.id == priority.id %} selected {% endif %}>
                                {{ priority.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="flex justify-between items-center">
                    <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75">
                        Update Task
                    </button>
                    <a href="/"
                       class="inline-flex items-center justify-center px-6 py-3 border border-gray-300 text-base font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 transition duration-300 ease-in-out transform hover:scale-105">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
